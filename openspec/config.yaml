schema: spec-driven

context: |
  magnetar-component-api is part of Magnetar (https://github.com/astorise/Magnetar), a Rust-first
  local AI Runtime. The Model Component contract: every released version of `magnetar:model-component-
  graph` and its guest bindings. Its specifications and changes live in this repository. A change that
  also reaches the Magnetar core is coordinated by a change of the same name in Magnetar, which links
  to the companion change here.
